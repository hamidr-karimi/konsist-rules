variables:
  GRADLE_USER_HOME: ".gradle" # use project .gradle as system .gradle to be cacheable
  GIT_STRATEGY: clone
  GIT_DEPTH: 1

.global_cache: &global_cache
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
    prefix: CACHE_GLOBAL
  paths:
    - ".gradle/"

.gradle-base:
  image: gradle:jdk17
  cache:
    - <<: *global_cache

stages:
  - build
  - publish

build-gradle:
  stage: build
  extends: .gradle-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - ./gradlew build --build-cache
  artifacts:
    paths:
      - build/libs/*.jar

publish-gradle:
  stage: publish
  extends: .gradle-base
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # Gradle exposes ORG_GRADLE_PROJECT_* env vars as project properties, which build.gradle.kts
    # reads via findProperty() as ARTIFACTORY_USERNAME / ARTIFACTORY_PASSWORD
    ORG_GRADLE_PROJECT_ARTIFACTORY_USERNAME: $REGISTRY_USERNAME
    ORG_GRADLE_PROJECT_ARTIFACTORY_PASSWORD: $REGISTRY_PASSWORD
  script:
    - ./gradlew publishAllPublicationsToTapsellArtifactoryRepository --build-cache
